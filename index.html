<!doctype html>
<html lang="ar" dir="rtl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title data-ar="تطبيق طلب الطعام" data-en="Food Ordering App">
			تطبيق طلب الطعام
		</title>
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="container">
			<div class="auth-container">
				<div class="auth-header">
					<h1
						id="app-title"
						data-ar="تطبيق طلب الطعام"
						data-en="Food Ordering App"
					>
						تطبيق طلب الطعام
					</h1>
					<div class="controls">
						<button id="lang-toggle" class="btn-icon">🌐</button>
						<button id="theme-toggle" class="btn-icon">🌙</button>
					</div>
				</div>

				<div class="auth-tabs">
					<button
						class="tab-btn active"
						data-tab="login"
						data-ar="تسجيل الدخول"
						data-en="Login"
					>
						تسجيل الدخول
					</button>
					<button
						class="tab-btn"
						data-tab="register"
						data-ar="إنشاء حساب"
						data-en="Register"
					>
						إنشاء حساب
					</button>
				</div>

				<div id="login-form" class="auth-form active">
					<h2 data-ar="تسجيل الدخول" data-en="Login">تسجيل الدخول</h2>
					<input
						data-ar=""
						type="email"
						id="login-email"
						placeholder="البريد الإلكتروني"
						data-ar-placeholder="البريد الإلكتروني"
						data-en-placeholder="Email"
						required
					/>
					<input
						data-ar=""
						type="password"
						id="login-password"
						placeholder="كلمة المرور"
						data-ar-placeholder="كلمة المرور"
						data-en-placeholder="Password"
						required
					/>
					<select data-ar="" id="login-role" required>
						<option
							value=""
							data-ar="اختر نوع الحساب"
							data-en="Select Account Type"
						>
							اختر نوع الحساب
						</option>
						<option value="user" data-ar="مستخدم" data-en="User">مستخدم</option>
						<option value="admin" data-ar="مسؤول" data-en="Admin">مسؤول</option>
						<option value="delivery" data-ar="موصل" data-en="Delivery">
							موصل
						</option>
					</select>
					<button
						type="submit"
						class="btn-primary"
						data-ar="دخول"
						data-en="Login"
						onclick="handleLogin()"
					>
						دخول
					</button>
				</div>

				<div id="register-form" class="auth-form">
					<h2 data-ar="إنشاء حساب" data-en="Register">إنشاء حساب</h2>
					<input
						data-ar=""
						type="text"
						id="register-name"
						placeholder="الاسم"
						data-ar-placeholder="الاسم"
						data-en-placeholder="Name"
						required
					/>
					<input
						data-ar=""
						type="email"
						id="register-email"
						placeholder="البريد الإلكتروني"
						data-ar-placeholder="البريد الإلكتروني"
						data-en-placeholder="Email"
						required
					/>
					<input
						data-ar=""
						type="password"
						id="register-password"
						placeholder="كلمة المرور"
						data-ar-placeholder="كلمة المرور"
						data-en-placeholder="Password"
						required
					/>
					<select data-ar="" id="register-role" required>
						<option
							value=""
							data-ar="اختر نوع الحساب"
							data-en="Select Account Type"
						>
							اختر نوع الحساب
						</option>
						<option value="user" data-ar="مستخدم" data-en="User">مستخدم</option>
						<option value="delivery" data-ar="موصل" data-en="Delivery">
							موصل
						</option>
					</select>
					<button
						type="submit"
						class="btn-primary"
						data-ar="إنشاء حساب"
						data-en="Register"
						onclick="handleRegister()"
					>
						إنشاء حساب
					</button>
				</div>

				<div id="message" class="message"></div>
			</div>
		</div>

		<script src="app.js"></script>
	</body>
</html>
